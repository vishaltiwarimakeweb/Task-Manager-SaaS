name: My First CI workflow

on:
  push:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Build Backend
        working-directory: Backend
        run: npm run build

  docker-push:
    needs: [frontend-build, backend-build]
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      contents: read
    
    env:
      AWS_REGION: ${vars.AWS_REGION}
      NEXT_PUBLIC_BASE_URL: ""
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${vars.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${vars.AWS_ROLE_ARN}
          aws-region: ${env.AWS_REGION}

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Backend dummy env creation
        run: touch Backend/.env

      - name: Build Docker Images
        run: docker compose build

      - name: Push Docker Images
        run: docker compose push

      - name: Verify Docker Images
        run: docker compose images
