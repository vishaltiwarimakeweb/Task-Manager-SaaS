name: My First CI workflow

on:
  push:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Build Backend
        working-directory: Backend
        run: npm run build

  docker-push:
    needs: [frontend-build, backend-build]
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      contents: read
    
    env:
      run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_ARN is empty or unavailable"
            exit 1
          fi
          echo "AWS_ROLE_ARN is configured."
          case "$AWS_ROLE_ARN" in
            arn:aws:iam::576889497241:role/*)
              echo "Role ARN format looks correct."
              ;;
            *)
              echo "ERROR: Unexpected role ARN format."
              exit 1
              ;;
          esac
      AWS_REGION: ${{ vars.AWS_REGION }}
      NEXT_PUBLIC_BASE_URL: ""
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ vars.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Backend dummy env creation
        run: touch Backend/.env

      - name: Build Docker Images
        run: docker compose build

      - name: Push Docker Images
        run: docker compose push

  deploy:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Check source IP
        run: curl -4 https://ifconfig.me
    
      - name: Trigger deployment through SSM
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-0ff57faaa63fae65b \
            --document-name AWS-RunShellScript \
            --comment "Deploy TaskWeb from GitHub Actions" \
            --parameters '{"commands":["sudo -u ubuntu /home/ubuntu/deploy.sh"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --region ap-south-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-0ff57faaa63fae65b \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region ap-south-1 \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0ff57faaa63fae65b \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region ap-south-1 \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0ff57faaa63fae65b \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment is still running or did not finish within 5 minutes."
          exit 1

      - name: Verify Docker Images
        run: docker compose images
